name: drink_water_app
description: 물 마시기 앱 (가칭) — 물을 마시며 화분을 키우고 꾸미는 수분 섭취 습관 앱
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  rive: ^0.13.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0
  package_info_plus: ^10.0.0
  share_plus: ^13.0.0
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/rive/
    - assets/decoration/
    - assets/cups/
